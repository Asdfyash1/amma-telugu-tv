name: Build Amma Telugu TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Release APK
        working-directory: .
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Copy APK to root for easy download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./Amma-Telugu-TV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amma-Telugu-TV-APK
          path: ./Amma-Telugu-TV.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Amma Telugu TV App v1.0.${{ github.run_number }}"
          files: ./Amma-Telugu-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

